name: Root Reports Repair
on:
  push:
    paths:
      - '.github/workflows/fix-reports-root.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair report DOM contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          before=s
          aliases={
            'repSales':'rTotal',
            'repProfit':'rProfit',
            'repQty':'rQty',
            'reportList':'reportRows',
          }
          for old,new in aliases.items():
            s=re.sub(r'(?<![A-Za-z0-9_-])'+re.escape(old)+r'(?![A-Za-z0-9_-])',new,s)
          p.write_text(s,encoding='utf-8')
          print('REPORT IDS FOUND:')
          ids=re.findall(r'\bid=["\']([^"\']*(?:report|Report|rep)[^"\']*)["\']',s)
          print('\n'.join(sorted(set(ids))) or 'NONE')
          print('CHANGED', s!=before)
          PY
      - name: Commit and remove repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No report alias changes needed.'
          else
            git commit -m 'Fix reports DOM IDs'
            git push
          fi
          git rm .github/workflows/fix-reports-root.yml
          git commit -m 'Remove temporary reports repair workflow'
          git push
