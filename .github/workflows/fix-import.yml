name: Repair Veronza import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair importData
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          if 'async function importData(event)' in s:
              raise SystemExit('importData already exists; refusing duplicate repair')
          marker='\nwindow.addEventListener(\'beforeunload\',()=>stopRealtime());'
          if marker not in s:
              raise SystemExit('beforeunload insertion marker not found')
          new=r'''\nasync function importData(event){let f=event.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result);let names=['products','sales','customers','suppliers','orders','returns'];if(!names.some(t=>Array.isArray(d[t])))throw Error('ملف غير صالح');let clean=row=>{let x={};Object.entries(row||{}).forEach(([k,v])=>{if(!['id','user_id','created_at','updated_at'].includes(k))x[k]=v});return x};let fp=row=>JSON.stringify(Object.keys(clean(row)).sort().map(k=>[k,clean(row)[k]]));
          if(Array.isArray(d.products)){for(const p of d.products){let row=clean(p);let barcode=String(row.barcode||'').trim();if(!barcode)barcode=await generateSequentialBarcode();row.barcode=barcode;let {error}=await sb.from('products').upsert(row,{onConflict:'user_id,barcode'});if(error)throw error}}
          let existing={sales,customers,suppliers,orders,returns:returnsRows};for(const name of ['customers','suppliers','orders','sales','returns']){let rows=Array.isArray(d[name])?d[name]:[];if(!rows.length)continue;let seen=new Set((existing[name]||[]).map(fp));for(const raw of rows){let row=clean(raw);if(name==='orders')delete row.order_no;let key=fp(row);if(seen.has(key))continue;let {error}=await sb.from(name).insert(row);if(error)throw error;seen.add(key)}}
          await loadAll();toast('تم استيراد البيانات بنجاح');}catch(e){console.error(e);toast('فشل الاستيراد: '+(e.message||'ملف غير صالح'))}finally{event.target.value=''}};r.readAsText(f)}
'''
          p.write_text(s.replace(marker,new+marker,1),encoding='utf-8')
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-import.yml
          git add app.js .github/workflows/fix-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix full-data import"
          git pull --rebase origin main
          git push
