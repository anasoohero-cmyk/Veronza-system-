name: Finalize V79

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Veronza startup logo and release V79
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const BUILD_VERSION='V\d+';", "const BUILD_VERSION='V79';", s, count=1)
          if n != 1: raise SystemExit('BUILD_VERSION marker not found')
          s=re.sub(r'<link rel="preload" as="image" href="\./veronza-splash\.jpg">','',s)
          s=re.sub(r'<style id="veronza-startup-splash-style">.*?</style>','',s,count=1,flags=re.S)
          s=re.sub(r'<div id="veronza-startup-splash".*?</div>','',s,count=1,flags=re.S)
          s=re.sub(r'<script>\(function\(\)\{function hide\(\).*?</script>','',s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          x=sw.read_text(encoding='utf-8')
          x=re.sub(r"const CACHE_NAME='V\d+';","const CACHE_NAME='V79';",x,count=1)
          sw.write_text(x,encoding='utf-8')
          PY
      - name: Commit V79
        run: |
          git add index.html sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove startup logo screen"
          git pull --rebase origin main
          git push
