name: Finalize V71

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set index build version and speed up update detection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const BUILD_VERSION='V70';", "const BUILD_VERSION='V71';", 1)
          s = s.replace("setTimeout(checkVeronzaUpdate,350);", "checkVeronzaUpdate();", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit V71 index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already finalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize V71 faster update detection"
          git push
