name: Finalize V77

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Veronza version V77
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s,n=re.subn(r"const BUILD_VERSION='V\d+';", "const BUILD_VERSION='V77';", s, count=1)
          if n != 1:
              raise SystemExit('BUILD_VERSION marker not found exactly once')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit V77
        run: |
          git add index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Release Veronza V77"
          git pull --rebase origin main
          git push
