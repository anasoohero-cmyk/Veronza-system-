name: Fix Veronza Reports
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch reports renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          start=s.find('function renderReports(){')
          if start < 0: raise SystemExit('renderReports not found')
          brace=s.find('{',start)
          depth=0; quote=None; esc=False; end=None
          for i in range(brace,len(s)):
              c=s[i]
              if quote:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c==quote: quote=None
              else:
                  if c in "'\"`": quote=c
                  elif c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          end=i+1; break
          if end is None: raise SystemExit('renderReports end not found')
          new="""function renderReports(){let range=$('reportRange')?.value||'all',now=new Date(),a=sales.filter(s=>{let d=new Date(s.created_at);if(range==='today')return d.toDateString()===now.toDateString();if(range==='7')return d<=now&&(now-d)<=7*86400000;if(range==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();return true});let total=a.reduce((x,s)=>x+Number(s.total||0),0),profit=a.reduce((x,s)=>x+Number(s.profit||0),0),qty=a.reduce((x,s)=>x+Number(s.qty||0),0);let rTotal=$('rTotal'),rProfit=$('rProfit'),rQty=$('rQty'),rAvg=$('rAvg'),rInventoryCost=$('rInventoryCost'),rPotential=$('rPotential'),reportRows=$('reportRows');if(rTotal)rTotal.textContent=money(total);if(rProfit)rProfit.textContent=money(profit);if(rQty)rQty.textContent=qty.toLocaleString('ar-LY');if(rAvg)rAvg.textContent=money(a.length?total/a.length:0);if(rInventoryCost)rInventoryCost.textContent=money(products.reduce((x,p)=>x+Number(p.buy||0)*Number(p.qty||0),0));if(rPotential)rPotential.textContent=money(products.reduce((x,p)=>x+Number(p.sell||0)*Number(p.qty||0),0));let top={};a.forEach(s=>{let k=s.product||s.barcode||'غير معروف';top[k]=(top[k]||0)+Number(s.qty||0)});let rows=Object.entries(top).sort((x,y)=>y[1]-x[1]).slice(0,20);if(reportRows)reportRows.innerHTML=rows.length?rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join(''):`<tr><td colspan="2" class="empty">لا توجد مبيعات</td></tr>`}"""
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
      - name: Commit fix and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-reports-now.yml
          git add app.js .github/workflows/fix-reports-now.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Veronza reports renderer'
          git push
