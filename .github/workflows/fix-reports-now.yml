name: Fix Veronza Reports
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch reports renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="""function renderReports(){let range=$('reportRange')?.value||'all',now=new Date(),a=sales.filter(s=>{let d=new Date(s.created_at);if(range==='today')return d.toDateString()===now.toDateString();if(range==='7')return d<=now&&(now-d)<=7*86400000;if(range==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();return true});let total=a.reduce((x,s)=>x+Number(s.total||0),0),profit=a.reduce((x,s)=>x+Number(s.profit||0),0),qty=a.reduce((x,s)=>x+Number(s.qty||0),0);$('rTotal').textContent=money(total);$('rProfit').textContent=money(profit);$('rQty').textContent=qty.toLocaleString('ar-LY');$('rAvg').textContent=money(a.length?total/a.length:0);$('rInventoryCost').textContent=money(products.reduce((x,p)=>x+Number(p.buy||0)*Number(p.qty||0),0));$('rPotential').textContent=money(products.reduce((x,p)=>x+Number(p.sell||0)*Number(p.qty||0),0));let top={};a.forEach(s=>{let k=s.product||s.barcode||'غير معروف';top[k]=(top[k]||0)+Number(s.qty||0)});let rows=Object.entries(top).sort((x,y)=>y[1]-x[1]).slice(0,20);$('reportRows').innerHTML=rows.length?rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join(''):`<tr><td colspan=\"2\" class=\"empty\">لا توجد مبيعات</td></tr>`}"""
          if old not in s:
              raise SystemExit('Target renderReports function not found; no changes made')
          new="""function renderReports(){let range=$('reportRange')?.value||'all',now=new Date(),a=sales.filter(s=>{let d=new Date(s.created_at);if(range==='today')return d.toDateString()===now.toDateString();if(range==='7')return d<=now&&(now-d)<=7*86400000;if(range==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();return true});let total=a.reduce((x,s)=>x+Number(s.total||0),0),profit=a.reduce((x,s)=>x+Number(s.profit||0),0),qty=a.reduce((x,s)=>x+Number(s.qty||0),0);let rTotal=$('rTotal'),rProfit=$('rProfit'),rQty=$('rQty'),rAvg=$('rAvg'),rInventoryCost=$('rInventoryCost'),rPotential=$('rPotential'),reportRows=$('reportRows');if(rTotal)rTotal.textContent=money(total);if(rProfit)rProfit.textContent=money(profit);if(rQty)rQty.textContent=qty.toLocaleString('ar-LY');if(rAvg)rAvg.textContent=money(a.length?total/a.length:0);if(rInventoryCost)rInventoryCost.textContent=money(products.reduce((x,p)=>x+Number(p.buy||0)*Number(p.qty||0),0));if(rPotential)rPotential.textContent=money(products.reduce((x,p)=>x+Number(p.sell||0)*Number(p.qty||0),0));let top={};a.forEach(s=>{let k=s.product||s.barcode||'غير معروف';top[k]=(top[k]||0)+Number(s.qty||0)});let rows=Object.entries(top).sort((x,y)=>y[1]-x[1]).slice(0,20);if(reportRows)reportRows.innerHTML=rows.length?rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join(''):`<tr><td colspan=\"2\" class=\"empty\">لا توجد مبيعات</td></tr>`}"""
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-reports-now.yml
          git add app.js .github/workflows/fix-reports-now.yml
          git commit -m "Fix Veronza reports renderer" || exit 0
          git push
